          format: double
          example: 10
          x-mapping: query_order.amount
        currency:
          $ref: '#/components/schemas/Currency'
        lastChangeDate:
          type: string
          description: last order update
          example: 28-01-2022
          x-mapping: query_order.lastDate
        status:
          $ref: '#/components/schemas/Status'
        orderItem:
          $ref: '#/components/schemas/OrderItem'
        orderHistories:
          type: array
          items:
            $ref: '#/components/schemas/OrderHistory'
    FilterOrderStatus:
      type: object
      properties:
        currentStatus:
          type: string
          description: Current status of the order
          example: VALIDATING_ISD
          x-mapping: query_order.history.lastStatus
        actionPerformed:
          type: string
          description: Action that the user should have performed on the order
          example: TO_VALIDATING_ISD
          x-mapping: query_order.history.action
        previousStatus:
          type: string
          description: State in which the order was when the action was performed
          example: AVAILABLE
          x-mapping: query_order.history.status
    OrderItem:
      type: object
      properties:
        identificationValue:
          type: string
          description: value for get a counterpart
          example: "17913233"
          x-mapping: query_order.billId
        beneficiary:
          $ref: '#/components/schemas/Beneficiary'
    Beneficiary:
      type: object
      properties:
        fullName:
          type: string
          description: beneficiary name
          example: Camilo Casas
        documentType:
          type: string
          description: beneficiry document type
          example: "0001"
        documentNumber:
          type: string
          description: beneficiry document number
          example: "9289282"
    OrderHistory:
      type: object
      properties:
        changeDate:
          type: string
          description: last order update
          example: 28-01-2022
          x-mapping: query_order.history.date
        action:
          type: string
          description: value for get a counterpart
          example: TO_APPROVE
          x-mapping: query_order.history.action
        customerUserId:
          type: string
          description: value for get a counterpart
          example: "17913233"
          x-mapping: query_order.history.customerUserId
        message:
          type: string
          description: action message
          example: This change is due to ...
          x-mapping: query_order.history.message
        status:
          $ref: '#/components/schemas/OrderHistoryStatus'
        nextStatus:
          $ref: '#/components/schemas/OrderHistoryStatus'
    Currency:
      type: object
      properties:
        code:
          type: string
          description: Code for currency
          example: USD
          x-mapping: query_order.currencyCode
    Status:
      type: object
      properties:
        code:
          type: string
          description: Code for status
          example: PENDING
          x-mapping: query_order.lastStatus
    OrderHistoryStatus:
      type: object
      properties:
        code:
          type: string
          description: Code for status
          example: PENDING
          x-mapping: query_order.history.status
    CustomerProduct:
      type: object
      properties:
        customerProductId:
          type: string
          description: product Id
          example: asdf-32323
          x-mapping: query_order.productUuid
        name:
          type: string
          description: product name
          example: REC
          x-mapping: query_order.orderType
    Error:
      type: object
      properties:
        errorCode:
          maxLength: 6
          pattern: ^[a-zA-Z]+$\d+$
          type: string
        developerMessage:
          maxLength: 256
          pattern: ^[a-zA-Z\s]*$
          type: string
        userMessage:
          maxLength: 256
          pattern: ^[a-zA-Z\s]*$
          type: string
        moreInfo:
          maxLength: 256
          pattern: ^[a-zA-Z\s]*$
          type: string
        version:
          maxLength: 256
          pattern: ^[a-zA-Z\s]*$
          type: string
          example: 1.0.0
        status:
          maxLength: 15
          type: integer
          example: 409
      additionalProperties: false
    request-date:
      type: string
  parameters:
    orderId:
      name: orderId
      in: query
      description: Order Id used to find the order
      required: true
      style: form
      explode: true
      schema:
        type: string
      example: "2672"
    app-name:
      name: app-name
      in: header
      description: Application Name - BackOffice | WebBanking | MobileToken
      required: true
      schema:
        type: string
        example: BackOffice
    caller-name:
      name: caller-name
      in: header
      description: Api name who request
      required: true
