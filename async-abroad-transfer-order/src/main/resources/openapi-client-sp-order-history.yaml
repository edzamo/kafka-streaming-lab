      schema:
        type: string
        example: 9939aadd00ee32
    x-device-ip:
      name: x-device-ip
      in: header
      description: IP address of origin of the request.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: 200.10.89.34
    x-language:
      name: x-language
      in: header
      description: ISO – 639-1  – Language Code - 2 digit code.
      required: true
      style: simple
      explode: false
      schema:
        maxLength: 5
        type: string
    customer-affiliation-id:
      name: customer-affiliation-id
      in: header
      description: Customer affiliated to business Banking
      required: true
      schema:
        type: string
        example: qwerccf-a60b-45e8-b5e3-215924834e5
