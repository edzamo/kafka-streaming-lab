---
openapi: 3.0.0
info:
  title: API Support Banking Order History V1
  description: |
    Support API for order history. <br>
    > <b>Dominio de Servicio BIAN</b> `Payment Order`<br>
  version: 1.0.1
externalDocs:
  description: API Documentation
  url: https://example.com/api-docs
servers:
  - url: http://localhost:8080/support/banking/v1
    description: Development
tags:
  - name: Order History
    description: Order History Controller
  - name: Unapproved Order
    description: Unapproved Order Controller
paths:
  /order-histories/retrieve:
    post:
      tags:
        - Order History
      summary: Retrieves Order History
      description: |
        ### Details:
        Retrieves order history by filter.

        There are two options in which an order can be filtered.
        1. Orders are filtered only in which: the lastStatus attribute of the database matches one of the statuses of the anyCurrentStatus attribute of the request object
        2. Orders that meet the following conditions are filtered:

            A. The database's lastStatus attribute must match the filterStatus[i].currentStatus element of the request object

            B. The filterStatus[i].actionPerformed attribute of the request object must match the history.action attribute of the database

            C. The filterStatus[i].previousStatus attribute must match the history.status attribute of the database

        | Expected result | Query Parameter |
        |-------------------- |-----------------|
        |Retrieves the first 10 registered orders  | - |
        |Retrieves the orders into a range   | limit, offset |
      operationId: PostOrderHistoryRetrieve
      parameters:
        - name: app-name
          in: header
          description: Application Name - BackOffice | WebBanking | MobileToken
          required: true
          schema:
            type: string
            example: BackOffice
        - name: caller-name
          in: header
          description: Api name who request
          required: true
          schema:
            type: string
            example: bs-guided-experience
        - name: process-code
          in: header
          description: Identifies the process or functionality
          required: false
          schema:
            type: string
            example: BJACAR01
        - name: request-date
          in: header
          description: Request Date | RFC 3339 Format
          required: true
          schema:
            $ref: '#/components/schemas/request-date'
          example: 2019-04-29 07:20:50.52Z
        - name: request-id
          in: header
          description: Request Identifier
          required: true
          schema:
            type: string
            example: id of request
        - name: x-session
          in: header
          description: Indicates the active session in which the user is transacting.
          required: true
          style: simple
          explode: false
          schema:
            type: string
            example: a9fd8deb-2aad-4d88-a7e3-d153c9e44b66
        - name: x-device
          in: header
          description: Identifier of the device.
          required: true
          style: simple
          explode: false
          schema:
            type: string
            example: 9939aadd00ee32
        - name: x-device-ip
          in: header
          description: IP address of origin of the request.
          required: true
          style: simple
          explode: false
          schema:
            type: string
            example: 200.10.89.34
        - name: x-language
          in: header
          description: ISO – 639-1  – Language Code - 2 digit code.
          required: true
          style: simple
          explode: false
          schema:
            maxLength: 5
            type: string
        - name: customer-affiliation-id
          in: header
          description: Customer affiliated to business Banking
          required: true
          schema:
            type: string
            example: qwerccf-a60b-45e8-b5e3-215924834e5
        - name: customer-user-id
          in: header
          description: User executing the operation
          required: true
          schema:
            type: string
            example: qwerccf-a60b-45e8-b5e3-215924834e5
        - name: offset
          in: query
          description: index to start returning the elements
          required: false
          style: form
          explode: true
          schema:
            minimum: 0
            type: integer
          example: 10
        - name: limit
          in: query
          description: Number of orders to return
          required: false
          style: form
          explode: true
          schema:
            minimum: 1
            type: integer
          example: 5
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostOrderHistoryRetrieveRequest'
        required: true
      responses:
        "200":
          description: Orders list.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PostOrderHistoryRetrieveResponse'
        "404":
          description: Username not found or user in company provided not found.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: You're not authorized to perform this operation.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: You don't have the right permissions to execute this operation.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: An error has occurred.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "502":
          description: The service is not available.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
  /order-histories/unapproved-orders:
    get:
      tags:
        - Unapproved Order
      summary: Retrieves unapproved orders
      description: |+
        ### Details:
        Retrieves unapproved orders that the user can manage.

        | Expected result | Query Parameter |
        |-------------------- |-----------------|
        |Retrieves unapproved orders that the user can see | productId, minAmount, maxAmount, currencyCode, excludeCategory |
        |Retrieves unapproved orders  | productId, minAmount, maxAmount, currencyCode |

        ### The combination described above are the only possible combinations of parameters, other combinations will return error.

      operationId: GetUnapprovedOrderByFilter
      parameters:
        - name: app-name
          in: header
          description: Application Name - BackOffice | WebBanking | MobileToken
          required: true
          schema:
            type: string
            example: BackOffice
        - name: caller-name
          in: header
          description: Api name who request
          required: true
          schema:
            type: string
            example: bs-guided-experience
        - name: process-code
          in: header
          description: Identifies the process or functionality
          required: false
          schema:
            type: string
            example: BJACAR01
        - name: request-date
          in: header
          description: Request Date | RFC 3339 Format
          required: true
          schema:
            $ref: '#/components/schemas/request-date'
          example: 2019-04-29 07:20:50.52Z
        - name: request-id
          in: header
          description: Request Identifier
          required: true
          schema:
            type: string
            example: id of request
        - name: x-session
          in: header
          description: Indicates the active session in which the user is transacting.
          required: true
          style: simple
          explode: false
          schema:
            type: string
            example: a9fd8deb-2aad-4d88-a7e3-d153c9e44b66
        - name: x-device
          in: header
          description: Identifier of the device.
          required: true
          style: simple
          explode: false
          schema:
            type: string
            example: 9939aadd00ee32
        - name: x-device-ip
          in: header
          description: IP address of origin of the request.
          required: true
          style: simple
          explode: false
          schema:
            type: string
            example: 200.10.89.34
        - name: x-language
          in: header
          description: ISO – 639-1  – Language Code - 2 digit code.
          required: true
          style: simple
          explode: false
          schema:
            maxLength: 5
            type: string
        - name: customer-affiliation-id
          in: header
          description: Customer affiliated to business Banking
          required: true
          schema:
            type: string
            example: qwerccf-a60b-45e8-b5e3-215924834e5
        - name: customer-user-id
          in: header
          description: User executing the operation
          required: true
          schema:
            type: string
            example: qwerccf-a60b-45e8-b5e3-215924834e5
        - name: productId
          in: query
          description: Product id of the orders
          required: true
          style: form
          explode: true
          schema:
            type: string
          example: 1091-108111
          x-mapping: query_order.productId
        - name: minAmount
          in: query
          description: minimum amount to filter the orders
          required: false
          style: form
          explode: true
          schema:
            type: number
            format: double
          example: 1234
        - name: maxAmount
          in: query
          description: maximum amount to filter the orders
          required: false
          style: form
          explode: true
          schema:
            type: number
            format: double
          example: 1827
        - name: currencyCode
          in: query
          description: currency code to filter
          required: false
          style: form
          explode: true
          schema:
            type: string
          example: USD
        - name: excludeCategory
          in: query
          description: An order requires that several people from different categories approve the order, the category to exclude is the category to which the user who is making the query belongs, since if an order has already been approved by someone from that category, it is not necessary to return it
          required: false
          style: form
          explode: true
          schema:
            type: string
          example: 1081-1818
      responses:
        "200":
          description: Orders list.
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetUnapprovedOrderByFilterResponse'
        "404":
          description: Username not found or user in company provided not found.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: You're not authorized to perform this operation.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: You don't have the right permissions to execute this operation.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: An error has occurred.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "502":
          description: The service is not available.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
