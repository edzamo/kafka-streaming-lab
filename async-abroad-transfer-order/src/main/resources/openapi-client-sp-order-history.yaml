components:
  schemas:
    PostOrderHistoryRetrieveRequest:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderFilter'
    OrderFilter:
      type: object
      properties:
        customerProductIds:
          type: array
          description: List of products ids to filter
          example:
            - 28972981ddd
            - 29872gdsiuyd9282
          items:
            type: string
        anyCurrentStatus:
          type: array
          description: List of status that do not have any additional conditions for filtering
          example:
            - PENDING
            - AVAILABLE
          items:
            type: string
          x-mapping: query_order.lastStatus
        filterStatus:
          type: array
          items:
            $ref: '#/components/schemas/FilterOrderStatus'
    PostOrderHistoryRetrieveResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Order:
      type: object
      properties:
        orderId:
          type: integer
          description: id order | trayId
          format: int64
          example: 465416517
          x-mapping: query_order.orderId
        customerProduct:
          $ref: '#/components/schemas/CustomerProduct'
        startOrderDate:
          type: string
          description: Initial Date for collect money
          example: 28-01-2022
          x-mapping: query_order.startDate
        endOrderDate:
          type: string
          description: End Date for collect money
          example: 28-01-2022
          x-mapping: query_order.endDate
        expirationDate:
          type: string
          description: Order expiration date
          example: 28-01-2022
        amount:
          type: number
          description: amount for collect
          format: double
          example: 10
          x-mapping: query_order.amount
        currency:
          $ref: '#/components/schemas/Currency'
        lastChangeDate:
          type: string
          description: last order update
          example: 28-01-2022
          x-mapping: query_order.lastDate
        status:
          $ref: '#/components/schemas/Status'
        orderItem:
          $ref: '#/components/schemas/OrderItem'
        orderHistories:
          type: array
          items:
            $ref: '#/components/schemas/OrderHistory'
    GetOrderHistoryByFilterRetrieveResponse:
      type: object
      properties:
        orderId:
          type: integer
          description: id order | trayId
          format: int64
          example: 465416517
          x-mapping: query_order.orderId
        customerProduct:
          $ref: '#/components/schemas/CustomerProduct'
        customerAffiliationId:
          type: string
          description: Id of company who generate the new Order.
          example: 1235454-74v87as85
          x-mapping: approval_order/company_contract_uuid
        startOrderDate:
          type: string
          description: Initial Date for collect money
          example: 28-01-2022
          x-mapping: query_order.startDate
        endOrderDate:
          type: string
          description: End Date for collect money
          example: 28-01-2022
          x-mapping: query_order.endDate
        expirationDate:
          type: string
          description: Order expiration date
          example: 28-01-2022
          x-mapping: query_order.expirationDate
        amount:
          type: number
          description: amount for collect
          format: double
          example: 10
          x-mapping: query_order.amount
        currency:
          $ref: '#/components/schemas/Currency'
        lastChangeDate:
          type: string
          description: last order update
          example: 28-01-2022
          x-mapping: query_order.lastDate
        status:
          $ref: '#/components/schemas/Status'
        orderItem:
          $ref: '#/components/schemas/OrderItem'
        orderHistories:
          type: array
          items:
            $ref: '#/components/schemas/OrderHistory'
    Pagination:
      type: object
      properties:
        itemQuantity:
          type: integer
          description: total number of available orders
          example: 40
    GetUnapprovedOrderByFilterResponse:
      type: object
      properties:
        orderId:
          type: integer
          description: id order | trayId
          format: int64
          example: 465416517
          x-mapping: query_order.orderId
        customerProduct:
          $ref: '#/components/schemas/CustomerProduct'
        startOrderDate:
          type: string
