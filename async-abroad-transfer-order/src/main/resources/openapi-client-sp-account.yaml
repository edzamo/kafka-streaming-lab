---
openapi: 3.0.0
info:
  title: API Support Banking Account
  description: |
    Support Api for retrieves customer accounts information.
    > <b>Dominio de Servicio BIAN</b> `Current Account`<br>
  version: 1.3.1
externalDocs:
  description: API Documentation
  url: https://example.com/api-docs
servers:
  - url: http://localhost:8080/support/banking/v1
    description: Development
tags:
  - name: Account
    description: Account Controller
  - name: Transaction
    description: Transaction Controller
  - name: Transaction Detail
    description: Transaction Detail Controller
paths:
  /accounts:
    get:
      tags:
        - Account
      summary: Retrieves a List  of a customer's accounts.
      description: |
        ### Details: Retrieves a List of a customer's accounts with additional details by their document number and identification type.<br>
      operationId: getAccountByFilter
      parameters:
        - name: app-name
          in: header
          description: Application Name - BackOffice | WebBanking | MobileToken
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: BackOffice
        - name: caller-name
          in: header
          description: Api name who request
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: bs-guided-experience
        - name: process-code
          in: header
          description: Identifies the process or functionality
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: BJACAR01
        - name: request-date
          in: header
          description: Request Date | RFC 3339 Format
          required: false
          style: simple
          explode: false
          schema:
            type: string
          example: 2019-04-29 07:20:50.52Z
        - name: request-id
          in: header
          description: Request Identifier
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: id of request
        - name: x-device
          in: header
          description: Identifier of the device.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: 9939aadd00ee32
        - name: x-device-ip
          in: header
          description: IP address of origin of the request.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: 200.10.89.34
        - name: x-session
          in: header
          description: Indicates the active session in which the user is transacting.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: a9fd8deb-2aad-4d88-a7e3-d153c9e44b66
        - name: x-language
          in: header
          description: ISO – 639-1  – Language Code - 2 digit code.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 5
            type: string
        - name: customer-affiliation-id
          in: header
          description: Customer affiliated to business Banking
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: qwerccf-a60b-45e8-b5e3-215924834e5
        - name: customer-user-id
          in: header
          description: User executing the operation
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: qwerccf-a60b-45e8-b5e3-215924834e5
        - name: X-Guid
          in: header
          description: Gateway | Indicates the active session in which the user is transacting.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: biddid-2203033-diuhdud
        - name: customerDocumentNumber
          in: query
          description: Customer identification document number.
          required: true
          style: form
          explode: true
          schema:
            type: string
            example: "1721553616"
        - name: customerDocumentType
          in: query
          description: Client identifier type. ID (0001) - Passport (0002) - RUC (0003).
          required: true
          style: form
          explode: true
          schema:
            type: string
            example: "0001"
        - name: accountsClassification
          in: query
          description: Accounts classification
          required: false
          style: form
          explode: true
          schema:
            type: string
            example: CAC
        - name: X-Agency
          in: header
          description: Gateway | Code of the agency where the user is registered.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 9
            type: string
            example: "21"
        - name: X-Geolocation
          in: header
          description: Gateway | Describes the location where the transaction originates.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 20
            type: string
            example: "-0.120670,-78.483371"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountByFilterResponse'
        "400":
          description: The request information it's not correct.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: You're not authorized to perform this operation.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: You don't have the right permissions to execute this operation.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not Found. The server cannot find the requested resource.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          description: "Too many requests to the resource {URI}"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: An error has occurred.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "504":
          description: Gateway timeout. The service is excessive application processing time.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
