          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: a9fd8deb-2aad-4d88-a7e3-d153c9e44b66
        - name: x-device
          in: header
          description: Identifier of the device.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: 9939aadd00ee32
        - name: x-device-ip
          in: header
          description: IP address of origin of the request.
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: 200.10.89.34
        - name: x-language
          in: header
          description: ISO – 639-1  – Language Code - 2 digit code.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 5
            type: string
        - name: customer-affiliation-id
          in: header
          description: Customer affiliated to business Banking
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: qwerccf-a60b-45e8-b5e3-215924834e5
        - name: customer-user-id
          in: header
          description: User executing the operation
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: qwerccf-a60b-45e8-b5e3-215924834e5
        - name: accountId
          in: path
          description: Account id | account identification | account number
          required: true
          style: simple
          explode: false
          schema:
            type: string
            example: "1721553616"
        - name: accountTypeDescription
          in: query
          description: Description of account
          required: true
          style: form
          explode: true
          schema:
            type: string
            example: 21 = Saving account  | 22 = Current account
        - name: limit
          in: query
          description: The number of items to return
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
            default: 20
        - name: offset
          in: query
          description: transactioniId of last list of transactions (default = 0)
          required: true
          style: form
          explode: true
          schema:
            type: integer
        - name: fromOperationDate
          in: query
          description: Initial date to obtain transactions.
          required: false
          style: form
          explode: true
          schema:
            type: string
            example: "12082021"
        - name: toOperationDate
          in: query
          description: Final date to obtain transactions.
          required: false
          style: form
          explode: true
          schema:
            type: string
            example: "12082021"
      responses:
        "200":
          description: Transactions account list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionResponse'
        "400":
          description: 400 Bad Request. The request information it's not correct.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: 401 Unauthorized.You're not authorized to perform this operation.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
