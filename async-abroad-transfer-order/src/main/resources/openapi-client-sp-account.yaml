  /accounts/{accountId}/transactions:
    get:
      tags:
        - Transaction
      summary: Get transactions from account request.
      description: |
        ### Details

          Returns transactions from an account.

        ### Valid Uses of Parameters
        | Expected result | Path Parameter | Query Parameter |
        |--------------------|--------------- |-----------------|
        |Get last moves        | accountId       | - |
        |Get movements in a range of dates        | accountId        | fromOperationDate, toOperationDate |
      operationId: getTransactionByAccountId
      parameters:
        - name: app-name
          in: header
          description: Application Name - BackOffice | WebBanking | MobileToken
          required: false
          style: simple
          explode: false
          schema:
            type: string
            example: BackOffice
        - name: caller-name
