spring.application.name=async-abroad-transfer-order
info.project.name=async-abroad-transfer-order

spring.main.allow-bean-definition-overriding=true
spring.output.ansi.enabled=ALWAYS
spring.cloud.compatibility-verifier.enabled=false

info.project.version=1.0.0

spring.jackson.date-format=com.example.banking.services.RFC3339DateFormat
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.base-path=/business/banking/v1/async-abroad-transfer/actuator

server.port= ${GENERIC_WS_PORT}

### EVENTHUB

# CONNECTION
spring.cloud.stream.kafka.binder.brokers=${ENGINE_EVENTHUB_HOST}:${GENERIC_EVENTHUB_PORT}
spring.cloud.stream.bindings.output.destination=${ENGINE_EVENTHUB_ABROAD}
spring.cloud.stream.kafka.binder.configuration.sasl.mechanism=PLAIN
spring.cloud.stream.kafka.binder.configuration.security.protocol=SASL_SSL
spring.cloud.stream.kafka.binder.configuration.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="Endpoint=sb://${ENGINE_EVENTHUB_HOST}/;SharedAccessKeyName=${ENGINE_EVENTHUB_KEY_NAME};SharedAccessKey=${ENGINE_EVENTHUB_KEY_VALUE}";



# READ THE EVENTS TOPIC
spring.cloud.function.definition=receive
spring.cloud.stream.bindings.receive-in-0.destination=${ENGINE_EVENTHUB_ABROAD}
# WRITE INTO THE TOPIC
spring.cloud.stream.bindings.retry-out-0.destination=${ENGINE_EVENTHUB_ABROAD}

# WRITE INTO THE TOPIC
spring.cloud.stream.bindings.interbank-out-0.destination=${ENGINE_EVENTHUB_ABROAD}

spring.cloud.stream.bindings.receive-in-0.consumer.maxAttempts=3
spring.cloud.stream.bindings.receive-in-0.consumer.backOffInitialInterval=500
spring.cloud.stream.bindings.receive-in-0.consumer.backOffMaxInterval=1000
spring.cloud.stream.bindings.receive-in-0.consumer.backOffMultiplier=2.0

logging.level.org.apache.kafka= WARN
#Cluster
http-client.api.client-bsAbroadTransferOrder.base-url=${CLUSTER_PATH_BS_ABROAD_TRANSFER_ORDER}
http-client.api.client-spAbroadTransferOrder.base-url=${CLUSTER_PATH_SP_ABROAD_TRANSFER_ORDER}
http-client.api.client-bsOrder.base-url=${CLUSTER_PATH_BS_ORDER}
http-client.api.client-spApprovalEngineSheduledTask.base-url=${CLUSTER_PATH_SP_APPROVAL_ENGINE_SHEDULED_TASK}
http-client.api.client-spAccount.base-url=${CLUSTER_PATH_SP_ACCOUNT}
http-client.api.client-bsOrderHistory.base-url=${CLUSTER_PATH_SP_ORDER_HISTORY}

CHANNEL=${CHANNEL}
LANGUAGE=${LANGUAGE}
DEVICE_IP=${DEVICE_IP}
APP_NAME=${APP_NAME}
STATE_AVAILABLE=${STATE_AVAILABLE}
STATE_PENDING=${STATE_PENDING}
STATE_FINAL_APPROVAL=${STATE_FINAL_APPROVAL}
ACTION_APPROVE=${ACTION_APPROVE}
STATE_ENABLED=${STATE_ENABLED}
ACTION_AVAILABLE=${ACTION_AVAILABLE}
ACTION_PENDING=${ACTION_PENDING}
ACTION_EXECUTE_INITIATE=${ACTION_EXECUTE_INITIATE}
ACTION_EXECUTE_APPROVE=${ACTION_EXECUTE_APPROVE}
GENERIC_USER_PATCH=${GENERIC_USER_PATCH}
GENERIC_USER_POST=${GENERIC_USER_POST}
ACTION_SPOT=${ACTION_SPOT}
EXECUTION_TIME=${EXECUTION_TIME}
SPOT=${SPOT}
APPLICATION_CODE=${APPLICATION_CODE}
STATE_SUCCESS=${STATE_SUCCESS}