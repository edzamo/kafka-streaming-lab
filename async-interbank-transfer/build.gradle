plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.10.0'
    id 'jacoco'
}

group = 'com.example.banking'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2025.0.0')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'

    // Necesarias para los clientes generados (openapi-generator, librería webclient)
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'jakarta.annotation:jakarta.annotation-api'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---- Clientes HTTP generados desde los contratos OpenAPI (uno por API) ----
def clients = [
        bsOrder                   : 'openapi-client-bs-order.yaml',
        bsInterbankTransferOrder  : 'openapi-client-bs-interbank-transfer-order.yaml',
        spInterbankTransferOrder  : 'openapi-client-sp-interbank-transfer-order.yaml',
]
def generatedBase = 'com.example.banking.interbank.adapter.out.http.generated'

clients.each { name, spec ->
    tasks.register("generate_${name}", org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
        generatorName = 'java'
        library = 'webclient'
        inputSpec = "$projectDir/src/main/resources/${spec}".toString()
        outputDir = "$buildDir/generated/openapi/${name}".toString()
        apiPackage = "${generatedBase}.${name}.api"
        modelPackage = "${generatedBase}.${name}.model"
        invokerPackage = "${generatedBase}.${name}.invoker"
        configOptions = [
                useJakartaEe     : 'true',
                dateLibrary      : 'java8',
                openApiNullable  : 'true',
                useBeanValidation: 'true',
                serializationLibrary: 'jackson',
        ]
        generateApiTests = false
        generateModelTests = false
    }
    sourceSets.main.java.srcDir("$buildDir/generated/openapi/${name}/src/main/java")
    tasks.named('compileJava') { dependsOn "generate_${name}" }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}
