          example: "232343333"
        productType:
          $ref: '#/components/schemas/ProductType'
        currency:
          $ref: '#/components/schemas/Currency'
    ProductType:
      type: object
      properties:
        code:
          type: string
          description: Account Type
          example: "2102"
        description:
          type: string
          description: Account description
          example: CTA. Description
    SourceProductType:
      type: object
      properties:
        productNumber:
          type: string
          description: account number
          example: "232343333"
        productType:
          $ref: '#/components/schemas/Type'
    DestinationProduct:
      type: object
