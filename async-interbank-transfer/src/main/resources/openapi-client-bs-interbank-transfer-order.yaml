    XGuid:
      name: X-Guid
      in: header
      description: Indicates the active session in which the user is transacting.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: b292bed18ac34a26bdc021ace9033b19
    XDevice:
      name: X-Device
      in: header
      description: Hash or device identifier.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: 9939aadd00ee32
    XDeviceIp:
      name: X-Device-Ip
      in: header
      description: IP address of origin of the request..
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: 200.10.89.34
    XSession:
      name: X-Session
      in: header
      description: Indicates the active session in which the user is transacting.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: a9fd8deb-2aad-4d88-a7e3-d153c9e44b66
    XAgency:
      name: X-Agency
      in: header
      description: Code of the agency where the user is registered.
      required: false
      style: simple
      explode: false
      schema:
        maxLength: 9
        type: string
