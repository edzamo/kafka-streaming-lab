        expirationDate:
          type: string
          description: expiration Date
          format: date
          nullable: false
          example: 2017-07-21
          x-mapping: third_party_transfer_order.expiration_date
        trayOrderId:
          type: string
          description: Id Customer Product.
          nullable: false
          example: "123444444"
          x-mapping: interbank_transfer_order.approval_order_id
        status:
          $ref: '#/components/schemas/Status'
        interbankTransferOrderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        orderHistory:
          $ref: '#/components/schemas/OrderHistory'
    ProcessingType:
      title: ProcessingType
      type: object
      properties:
        code:
          type: string
          description: order type (online or scheduled)
          example: IMMEDIATE / SCHEDULED
    OrderItem:
      title: OrderItem
      type: object
      properties:
        interbankTransferItemId:
          type: string
          description: Id Item
          nullable: false
          example: "123"
          x-mapping: items_interbank_transfer_order.items_interbank_transfer_order_uuid
        amount:
          type: number
          description: amount for order
          nullable: false
          example: 1000
          x-mapping: items_interbank_transfer_order.amount
        currency:
          $ref: '#/components/schemas/Currency'
        beneficiary:
          $ref: '#/components/schemas/BeneficiaryResponse'
        destinationProduct:
          $ref: '#/components/schemas/DestinationProduct'
        transaction:
          $ref: '#/components/schemas/TransactionResponse'
        description:
          type: string
          description: beneficiary identification Value.
          nullable: false
          example: "098567"
          x-mapping: items_interbank_transfer_order.description
    Customer:
      title: Customer
      type: object
      properties:
        fullName:
          type: string
          description: Customer Name
          nullable: false
          example: Mayra Alejandra Romero Alava
        documentType:
          type: string
          description: Customer document type
          example: "10101"
        documentNumber:
          type: string
          description: Customer document number
          example: "1981918"
    TransactionResponse:
      title: Transaction
      type: object
      properties:
        comission:
          type: string
          description: Amount transaction
          nullable: false
          example: "0.36"
        tax:
          $ref: '#/components/schemas/Tax'
        executionChannel:
          type: string
          description: Amount transaction
          nullable: false
          example: SNP
        displayMessage:
          type: string
          description: mensaje sobre la ejecuion de la transaccion
          nullable: false
          example: "La transferencia solicitada será debitada de su cuenta inmediatamente. Si la ejecuta hasta las 11H30 será acreditada a la cuenta destino en el transcurso del mismo día, caso contrario el dinero sera acreditado en la cuenta destino en el transcurso del siguiente día hábil."
    Tax:
      type: object
      properties:
        name:
          type: string
          description: estatus for order
          example: iva
          x-mapping: items_interbank_transfer_order.name
        value:
          type: number
          description: estatus for order
          example: 0.04
          x-mapping: items_interbank_transfer_order.value
    BeneficiaryResponse:
      type: object
      properties:
        documentType:
          type: string
          description: Beneficiary Document type.
          nullable: false
          example: RUC
          x-mapping: items_interbank_transfer_order.document_type
        documentNumber:
          type: string
          description: Beneficiary ocument number.
          nullable: false
          example: "1231233450"
          x-mapping: items_interbank_transfer_order.document_number
        fullName:
          type: string
          description: beneficiary fullName.
          nullable: false
          example: Jesus Alberto
          x-mapping: items_interbank_transfer_order.full_name
        email:
          type: string
          description: Email beneficiary.
          nullable: false
          example: collectionorder@domain.com
          x-mapping: items_interbank_transfer_order.email
    OrderHistory:
      type: object
      properties:
        startOrderDate:
          type: string
          description: Initial Date for collect money
          example: 28/01
        endOrderDate:
          type: string
          description: End Date for collect money
          example: 28/01
        lastChangeDate:
          type: string
          description: Last Date when the order changes
          example: 28/01
        status:
          $ref: '#/components/schemas/Status'
        orderHistoryChanges:
          type: array
          items:
            $ref: '#/components/schemas/OrderHistoryChange'
    OrderHistoryChange:
      type: object
      properties:
        changeDate:
          type: string
          description: Date when the status change was made
          example: 2022-06-05T20:10:05
        customerUser:
          $ref: '#/components/schemas/User'
        status:
          $ref: '#/components/schemas/Status'
        action:
          type: string
          description: Action performed
          example: TO_APPROVAL
        nextStatus:
          $ref: '#/components/schemas/Status'
    User:
      type: object
      properties:
        documentNumber:
          maxLength: 10
          type: string
          description: Customer identification document number.
          example: "1721553616"
        documentType:
          maxLength: 4
          type: string
          description: Client identifier type. ID (0001) - Passport (0002) - RUC (0003).
          example: "0001"
        names:
          title: Names of user.
          type: string
          example: Jhon Carlos
        surnames:
          title: Last names of user.
          type: string
          example: Steward Colling
        email:
          title: Email
          type: string
          example: jhondoe@mail.com
        position:
          type: string
          description: Employment relationship
          example: Manager
    BsGetFinancialEntityByFilterResponse:
      type: array
      items:
        $ref: '#/components/schemas/FinancialEntityList'
    FinancialEntityList:
      title: FinancialEntityList
      type: object
      properties:
        financialEntityId:
          type: string
          description: Id for entity
          nullable: false
          example: "1234"
        fullName:
          type: string
          description: Full name the beneficiary.
          nullable: false
          example: Example Bank
        hasAgreement:
          type: string
          description: If the entitie have a agreement
          nullable: false
          example: Y | N
    BsPostInterbankTransferRequest:
