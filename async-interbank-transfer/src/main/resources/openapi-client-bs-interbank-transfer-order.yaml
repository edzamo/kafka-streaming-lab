          description: IP address of origin of the request.
          required: true
          style: simple
          explode: false
          schema:
            type: string
            example: 200.10.89.34
        - name: x-language
          in: header
          description: ISO – 639-1  – Language Code - 2 digit code.
          required: true
          style: simple
          explode: false
          schema:
            maxLength: 5
            type: string
        - name: customer-affiliation-id
          in: header
          description: Customer affiliation
          required: true
          style: simple
          explode: false
          schema:
            type: string
            example: bac6d24a-4115-4bcf-89b8-946eeb085962
        - name: customer-user-id
          in: header
          description: User executing the operation
          required: true
          style: simple
          explode: false
          schema:
            type: string
            example: qwerccf-a60b-45e8-b5e3-215924834e5
          x-mapping: interbank_transfer_order.user_company_contract _uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BsGetFinancialEntityByFilterResponse'
        "400":
          description: 400 Bad Request. The request information it's not correct.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: 401 Unauthorized.You're not authorized to perform this operation.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: 403 Forbidden. You don't have the right permissions to execute this operation.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: 404 Not Found. The server cannot find the requested resource.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: 500 Internal Server Error. An error has occurred.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
        "502":
          description: 502 Bad Gateway. The service unable to get a valid response.
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    BsGetInterbankTransferOrderResponse:
      $ref: '#/components/schemas/GetInterbankTransferOrder'
    GetInterbankTransferOrder:
