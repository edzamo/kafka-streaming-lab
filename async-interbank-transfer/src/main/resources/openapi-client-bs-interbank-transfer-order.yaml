      type: object
      properties:
        customerProductId:
          type: string
          description: company contract product uuid  | interbank Transfer order
          example: 35461fe8-644e-465e-9635-f28638cf4322
        sourceProduct:
          $ref: '#/components/schemas/SourceProduct'
        processingType:
          $ref: '#/components/schemas/ProcessingType'
