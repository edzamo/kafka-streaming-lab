        customerProductId:
          type: string
          description: company contract product uuid  | interbank Transfer order
          example: 35461fe8-644e-465e-9635-f28638cf4322
        customer:
          $ref: '#/components/schemas/Customer'
        sourceProduct:
          $ref: '#/components/schemas/SourceProductType'
        uploadType:
          $ref: '#/components/schemas/LoadType'
        processingType:
          $ref: '#/components/schemas/ProcessingType'
        executionDate:
          type: string
