      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: business banking
      x-mapping: interbank_transfer_order.channel
    customer-user-id:
      name: customer-user-id
      in: header
      description: User executing the operation
      required: true
      style: simple
      explode: false
      schema:
        type: string
