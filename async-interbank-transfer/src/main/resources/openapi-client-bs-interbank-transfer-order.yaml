        beneficiary:
          $ref: '#/components/schemas/Beneficiary'
        destinationProduct:
          $ref: '#/components/schemas/DestinationProduct'
        transaction:
          $ref: '#/components/schemas/TransactionResponse'
    request-date:
      type: string
    Error:
      required:
        - developerMessage
        - errorCode
        - userMessage
      type: object
      properties:
        errorCode:
          maxLength: 6
          pattern: "^[a-zA-Z]+$\\d+$"
          type: string
          example: "6"
        developerMessage:
          maxLength: 256
          pattern: "^[a-zA-Z\\s]*$"
          type: string
          example: Coding Error
        userMessage:
          maxLength: 256
          pattern: "^[a-zA-Z\\s]*$"
          type: string
          example: Error al validar dispositvo
        moreInfo:
          maxLength: 256
          pattern: "^[a-zA-Z\\s]*$"
          type: string
          example: ""
        version:
          maxLength: 256
          pattern: "^[a-zA-Z\\s]*$"
          type: string
          example: 1.0.0
        status:
          maxLength: 15
          type: number
          example: 409
  responses:
    BadRequest:
      description: 400 Bad Request. The request information it's not correct.
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 401 Unauthorized.You're not authorized to perform this operation.
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
