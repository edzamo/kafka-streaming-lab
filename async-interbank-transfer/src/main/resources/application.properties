spring.profiles.active=local

management.endpoints.web.base-path=/support/banking/v1/async-interbank-transfer-v1/actuator/
management.endpoints.web.exposure.include=health, loggers

#PROYECT
info.project.name= async-interbank-transfer
spring.application.name=async-interbank-transfer
info.project.version= 1.0.0
spring.main.allow-bean-definition-overriding=on
spring.jackson.date-format=com.example.banking.services.RFC3339DateFormat
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

## Kafka logging
logging.level.org.apache.kafka=WARN

## CONNECTION TO BUS EVENT
spring.cloud.stream.kafka.binder.brokers=${ENGINE_EVENTHUB_HOST}:${GENERIC_EVENTHUB_PORT}
spring.cloud.stream.bindings.output.destination=${ENGINE_EVENTHUB_INTERBANK}
spring.cloud.stream.kafka.binder.configuration.sasl.mechanism=PLAIN
spring.cloud.stream.kafka.binder.configuration.security.protocol=SASL_SSL
spring.cloud.stream.kafka.binder.configuration.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="Endpoint=sb://${ENGINE_EVENTHUB_HOST}/;SharedAccessKeyName=${EH_DAC_ALL_LISTED_SEND};SharedAccessKey=${BUSINESS_BANKING_EVHNS_LISTEN_SEND_SHARED_ACCESS_KEY}";

#READ THE EVENTS TOPIC
spring.cloud.function.definition=receive
spring.cloud.stream.bindings.receive-in-0.destination=${ENGINE_EVENTHUB_INTERBANK}
spring.cloud.stream.bindings.receive-in-0.group=${ENGINE_EVENTHUB_INTERBANK}
# WRITE INTO THE TOPIC
spring.cloud.stream.bindings.retry-out-0.destination=${ENGINE_EVENTHUB_INTERBANK}

spring.cloud.stream.bindings.receive-in-0.consumer.maxAttempts=3
spring.cloud.stream.bindings.receive-in-0.consumer.backOffInitialInterval=500
spring.cloud.stream.bindings.receive-in-0.consumer.backOffMaxInterval=1000
spring.cloud.stream.bindings.receive-in-0.consumer.backOffMultiplier=2.0

http-client.api.client-spInterbankTransferOrder.base-url=${CLUSTER_PATH_SP_INTERBANK_TRANSFER_ORDER}
http-client.api.client-bsInterbankTransferOrder.base-url=${CLUSTER_PATH_BS_INTERBANK_TRANSFER_ORDER}
http-client.api.client-bsOrder.base-url=${CLUSTER_PATH_BS_ORDER}

#Redis
spring.redis.host=${GENERIC_REDIS_HOST}
spring.redis.port=${GENERIC_REDIS_PORT}
spring.redis.password=${GENERIC_REDIS_PASSWORD}
spring.redis.database=0
spring.redis.ssl=true
management.health.redis.enabled=false

SEG_INTERVAL=${SEG_INTERVAL}
SEG_INTERVAL_LIMIT=${SEG_INTERVAL_LIMIT}
SEG_INTERVAL_INIT=${SEG_INTERVAL_INIT}
ERROR_LAST_STEP=${ERROR_LAST_STEP}
STATUS_LAST_STEP=${STATUS_LAST_STEP}
USER_SYSTEM_DIRECT_TRANSFER=${USER_SYSTEM_DIRECT_TRANSFER}
CLAIM_NAME=${CLAIM_NAME}
X_GUID=${X_GUID}
X_DEVICE=${X_DEVICE}
X_DEVICE_IP=${X_DEVICE_IP}
X_SESSION=${X_SESSION}
X_AGENCY=${X_AGENCY}
X_GEOLOCATION=${X_GEOLOCATION}

# Header config
app.name=${APP_NAME}
execute.order.process.code=${EXECUTE_ORDER_PROCESS_CODE}
modify.order.process.code=${MODIFY_ORDER_PROCESS_CODE}
default.header.x-device=${DEFAULT_HEADER_X_DEVICE}
default.header.x-device-ip=${DEFAULT_HEADER_X_DEVICE_IP}

# Logback config
#logging.config=logback.xml