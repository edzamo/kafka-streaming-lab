# All environment-specific values come from environment variables. Nothing secret or host-specific lives here.
# To run locally: SPRING_PROFILES_ACTIVE=local with an untracked application-local.properties
# (see application-local.properties.example).

management.endpoints.web.base-path=/support/banking/v1/async-interbank-transfer-v1/actuator/
management.endpoints.web.exposure.include=health, loggers
management.health.redis.enabled=false

# Project
info.project.name=async-interbank-transfer
spring.application.name=async-interbank-transfer
info.project.version=1.0.0
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Kafka logging
logging.level.org.apache.kafka=WARN

# Connection to the event bus (Azure Event Hubs over the Kafka protocol)
spring.cloud.stream.kafka.binder.brokers=${ENGINE_EVENTHUB_HOST}:${GENERIC_EVENTHUB_PORT}
spring.cloud.stream.kafka.binder.configuration.sasl.mechanism=PLAIN
spring.cloud.stream.kafka.binder.configuration.security.protocol=SASL_SSL
spring.cloud.stream.kafka.binder.configuration.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="Endpoint=sb://${ENGINE_EVENTHUB_HOST}/;SharedAccessKeyName=${EH_DAC_ALL_LISTED_SEND};SharedAccessKey=${BUSINESS_BANKING_EVHNS_LISTEN_SEND_SHARED_ACCESS_KEY}";

# Read the events topic
spring.cloud.function.definition=receive
spring.cloud.stream.bindings.receive-in-0.destination=${ENGINE_EVENTHUB_INTERBANK}
spring.cloud.stream.bindings.receive-in-0.group=${ENGINE_EVENTHUB_INTERBANK}
spring.cloud.stream.bindings.receive-in-0.consumer.maxAttempts=3
spring.cloud.stream.bindings.receive-in-0.consumer.backOffInitialInterval=500
spring.cloud.stream.bindings.receive-in-0.consumer.backOffMaxInterval=1000
spring.cloud.stream.bindings.receive-in-0.consumer.backOffMultiplier=2.0

# Write retries into the same topic. The binding name is read by the publisher from interbank.retry.binding
spring.cloud.stream.bindings.retry-out-0.destination=${ENGINE_EVENTHUB_INTERBANK}

# Redis (pub/sub notifications)
spring.data.redis.host=${GENERIC_REDIS_HOST}
spring.data.redis.port=${GENERIC_REDIS_PORT}
spring.data.redis.password=${GENERIC_REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.ssl.enabled=true

# Retry policy, in seconds (SEG_INTERVAL_INIT: first wait; SEG_INTERVAL: step per retry; SEG_INTERVAL_LIMIT: give up)
interbank.retry.initial-seconds=${SEG_INTERVAL_INIT}
interbank.retry.step-seconds=${SEG_INTERVAL}
interbank.retry.limit-seconds=${SEG_INTERVAL_LIMIT}
interbank.retry.binding=retry-out-0

# Process codes sent downstream and the status an exhausted order is left in
interbank.process.execute-code=${EXECUTE_ORDER_PROCESS_CODE}
interbank.process.modify-code=${MODIFY_ORDER_PROCESS_CODE}
interbank.process.error-status=${ERROR_LAST_STEP}

# Redis channel the presentation layer listens on
interbank.notification.channel=${CLAIM_NAME}

# Downstream HTTP APIs
interbank.downstream.urls.sp-interbank-transfer-order=${CLUSTER_PATH_SP_INTERBANK_TRANSFER_ORDER}
interbank.downstream.urls.bs-interbank-transfer-order=${CLUSTER_PATH_BS_INTERBANK_TRANSFER_ORDER}
interbank.downstream.urls.bs-order=${CLUSTER_PATH_BS_ORDER}
interbank.downstream.timeout=${DOWNSTREAM_TIMEOUT:10s}
interbank.downstream.system-user-id=${USER_SYSTEM_DIRECT_TRANSFER}
interbank.downstream.caller-name=${spring.application.name}
interbank.downstream.app-name=${APP_NAME}
interbank.downstream.device=${DEFAULT_HEADER_X_DEVICE}
interbank.downstream.device-ip=${DEFAULT_HEADER_X_DEVICE_IP}
interbank.downstream.agency=${X_AGENCY}
interbank.downstream.geolocation=${X_GEOLOCATION}
